<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo-Rebalancer V3 | Cloud Sync & Auto-Update</title>
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 🔴 NEW: Firebase SDKs (จำเป็นสำหรับระบบ Login และ Cloud Database) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // =========================================================================
        // 🔴🔴🔴 TECH LEAD INSTRUCTION: ใส่ FIREBASE CONFIG ของคุณตรงนี้ 🔴🔴🔴
        // (ต้องไปสมัครที่ firebase.google.com -> สร้างโปรเจกต์ -> Web App)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "ใส่_API_KEY_ของคุณที่นี่",
            authDomain: "โปรเจกต์ของคุณ.firebaseapp.com",
            projectId: "โปรเจกต์ของคุณ",
            storageBucket: "โปรเจกต์ของคุณ.firebasestorage.app",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdefg"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            try {
                firebase.initializeApp(firebaseConfig);
            } catch (err) {
                console.error("Firebase Initialization Error (รอกรอก Config):", err);
            }
        }
        const auth = firebase.apps.length ? firebase.auth() : null;
        const db = firebase.apps.length ? firebase.firestore() : null;

        const { useState, useEffect, useMemo, useCallback } = React;

        const formatMoney = (amount, currency = 'THB') => {
            const symbol = currency === 'USD' ? '$' : '฿';
            return symbol + amount.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };
        const formatPercent = (percent) => (percent).toLocaleString("th-TH", { maximumFractionDigits: 1 }) + "%";

        function App() {
            // --- 🔐 SYSTEM: User Auth State ---
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            // --- 📦 SYSTEM: Data State ---
            const [portfolio, setPortfolio] = useState([]);
            const [prices, setPrices] = useState({});
            const [fxRate, setFxRate] = useState(35.00); 
            const [isLoading, setIsLoading] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false); // สถานะโชว์ว่ากำลังเซฟขึ้น Cloud
            
            const [rebalanceMode, setRebalanceMode] = useState('CLASSIC');
            const [cashToAdd, setCashToAdd] = useState(0);
            const [dcaAmount, setDcaAmount] = useState(0);

            // Form States
            const [editId, setEditId] = useState(null);
            const [symbol, setSymbol] = useState("");
            const [shares, setShares] = useState("");
            const [avgPrice, setAvgPrice] = useState("");
            const [currency, setCurrency] = useState("USD");
            const [targetWeight, setTargetWeight] = useState("");

            // 1. Auth Listener: ตรวจสอบการ Login
            useEffect(() => {
                if (!auth) { setAuthLoading(false); return; }
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // 2. Data Listener: ดึงข้อมูลพอร์ตจาก Cloud Firestore
            useEffect(() => {
                if (user && db) {
                    setIsSyncing(true);
                    const docRef = db.collection('users').doc(user.uid);
                    const unsubscribe = docRef.onSnapshot((doc) => {
                        if (doc.exists) {
                            setPortfolio(doc.data().portfolio || []);
                        } else {
                            // ถ้ายังไม่มีข้อมูล ให้สร้างเอกสารใหม่
                            docRef.set({ portfolio: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                        }
                        setIsSyncing(false);
                    }, (error) => {
                        console.error("Error fetching data:", error);
                        setIsSyncing(false);
                    });
                    return () => unsubscribe();
                } else {
                    setPortfolio([]);
                }
            }, [user]);

            // 3. Fetch Data (อัปเกรด: อ่านจากไฟล์ Static ที่ GitHub Actions อัปเดตให้ทุก 7 โมงเช้า)
            const fetchMarketData = useCallback(async () => {
                setIsLoading(true);
                let newPrices = { ...prices };
                let currentFx = fxRate;

                try {
                    // 🌟 ARCHITECT LOGIC: ลองอ่านจาก prices.json ที่ GitHub Actions สร้างไว้ก่อน (โหลดไวมาก, ไม่ล่ม)
                    const staticRes = await fetch(`./prices.json?t=${new Date().getTime()}`);
                    if (staticRes.ok) {
                        const staticData = await staticRes.json();
                        setPrices(staticData.prices || {});
                        if(staticData.fxRate) setFxRate(staticData.fxRate);
                        setIsLoading(false);
                        return; // จบการทำงาน ถ้ามีไฟล์
                    }
                } catch (err) {
                    console.log("No static prices.json found. Falling back to live fetch...");
                }

                // 🌟 FALLBACK: ถ้าระบบ 7 โมงเช้ายังไม่ทำงาน (หรือตอนกำลังเทสต์) ให้ดึงสด
                if (portfolio.length > 0) {
                    try {
                        const proxyUrl = 'https://corsproxy.io/?';
                        
                        // ดึงค่าเงินบาท
                        const fxUrl = encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/THB=X');
                        const fxRes = await fetch(proxyUrl + fxUrl);
                        if (fxRes.ok) {
                            const fxData = await fxRes.json();
                            currentFx = fxData.chart.result[0].meta.regularMarketPrice;
                            setFxRate(currentFx);
                        }

                        // ดึงราคาหุ้น
                        for (let item of portfolio) {
                            if (item.currency === 'THB' && !item.symbol.includes('.')) {
                                if (item.symbol === 'CASH') newPrices[item.symbol] = 1;
                                continue;
                            }
                            try {
                                const ticker = item.symbol.toUpperCase();
                                const targetUrl = encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`);
                                const response = await fetch(proxyUrl + targetUrl);
                                if (response.ok) {
                                    const data = await response.json();
                                    newPrices[ticker] = data.chart.result[0].meta.regularMarketPrice;
                                }
                            } catch (err) { console.error(`Error fetching ${item.symbol}`); }
                        }
                    } catch (error) {
                        console.error("Live fetch failed", error);
                    }
                }
                
                setPrices(newPrices);
                setIsLoading(false);
            }, [portfolio, fxRate, prices]);

            useEffect(() => { 
                // ดึงราคาครั้งเดียวตอนที่พอร์ตโหลดเสร็จ หรือเข้ามาใหม่
                if(user) fetchMarketData(); 
            }, [user]);

            // 4. Rebalancing Engine (เหมือน V2)
            const analysis = useMemo(() => {
                let currentTotalValueTHB = 0;
                let totalTargetWeight = 0;
                let totalCostTHB = 0;

                const enrichedPortfolio = portfolio.map(item => {
                    const marketPrice = prices[item.symbol] || item.avgPrice || 1; 
                    const costTHB = item.avgPrice * item.shares * (item.currency === 'USD' ? fxRate : 1);
                    const currentValueTHB = marketPrice * item.shares * (item.currency === 'USD' ? fxRate : 1);
                    
                    currentTotalValueTHB += currentValueTHB;
                    totalTargetWeight += item.targetWeight;
                    totalCostTHB += costTHB;

                    const profitLoss = currentValueTHB - costTHB;
                    const profitLossPercent = costTHB > 0 ? (profitLoss / costTHB) * 100 : 0;

                    return { ...item, marketPrice, currentValueTHB, costTHB, profitLoss, profitLossPercent };
                });

                const isWeightValid = totalTargetWeight === 100;
                const targetTotalValueTHB = currentTotalValueTHB + (rebalanceMode === 'CLASSIC' ? 0 : Number(cashToAdd));

                const rebalancePlan = enrichedPortfolio.map(item => {
                    const targetValueTHB = targetTotalValueTHB * (item.targetWeight / 100);
                    const currentWeight = currentTotalValueTHB > 0 ? (item.currentValueTHB / currentTotalValueTHB) * 100 : 0;
                    let diffValueTHB = targetValueTHB - item.currentValueTHB;
                    
                    if (rebalanceMode === 'BUY_ONLY' && diffValueTHB < 0) diffValueTHB = 0;

                    const actionValueNative = item.currency === 'USD' ? diffValueTHB / fxRate : diffValueTHB;
                    const actionShares = item.marketPrice > 0 ? actionValueNative / item.marketPrice : 0;

                    return { ...item, currentWeight, targetValueTHB, diffValueTHB, actionShares };
                });

                return { currentTotalValueTHB, totalCostTHB, totalProfitLoss: currentTotalValueTHB - totalCostTHB, targetTotalValueTHB, totalTargetWeight, isWeightValid, rebalancePlan };
            }, [portfolio, prices, fxRate, rebalanceMode, cashToAdd]);

            // 5. Handlers (Save to Cloud)
            const syncToCloud = async (newPortfolio) => {
                if (!user || !db) return;
                setIsSyncing(true);
                try {
                    await db.collection('users').doc(user.uid).update({ portfolio: newPortfolio, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
                } catch (error) {
                    console.error("Error saving to cloud:", error);
                    alert("บันทึกข้อมูลไม่สำเร็จ");
                }
                setIsSyncing(false);
            };

            const saveAsset = (e) => {
                e.preventDefault();
                if (!symbol || !shares || !targetWeight) return;
                
                const assetData = {
                    symbol: symbol.toUpperCase(),
                    shares: parseFloat(shares),
                    avgPrice: parseFloat(avgPrice) || 0,
                    currency,
                    targetWeight: parseFloat(targetWeight)
                };

                let newPortfolio;
                if (editId) {
                    newPortfolio = portfolio.map(p => p.id === editId ? { ...p, ...assetData } : p);
                    setEditId(null);
                } else {
                    newPortfolio = [...portfolio, { id: Date.now().toString(), ...assetData }];
                }
                
                setPortfolio(newPortfolio);
                syncToCloud(newPortfolio); // เซฟขึ้น Cloud
                
                setSymbol(""); setShares(""); setAvgPrice(""); setTargetWeight(""); setCurrency("USD");
                setTimeout(fetchMarketData, 100); 
            };

            const editAsset = (item) => {
                setEditId(item.id);
                setSymbol(item.symbol); setShares(item.shares); setAvgPrice(item.avgPrice);
                setCurrency(item.currency); setTargetWeight(item.targetWeight);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const removeAsset = (id) => {
                if(window.confirm("ยืนยันการลบสินทรัพย์นี้?")) {
                    const newPortfolio = portfolio.filter(a => a.id !== id);
                    setPortfolio(newPortfolio);
                    syncToCloud(newPortfolio); // ลบบน Cloud
                    if(editId === id) setEditId(null); 
                }
            };

            const loginWithGoogle = () => {
                if (!auth) return alert("กรุณาใส่ Firebase Config ในโค้ดก่อนใช้งาน");
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(err => alert(err.message));
            };

            const logout = () => {
                if(auth) auth.signOut();
            };

            // ---------------- UI RENDER ----------------

            if (authLoading) {
                return <div className="min-h-screen flex items-center justify-center"><div className="text-xl font-bold animate-pulse text-blue-400">Loading Robo-Rebalancer...</div></div>;
            }

            // 🌟 หน้า Login
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full text-center fade-in">
                            <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 mb-2">Robo-Rebalancer</h1>
                            <p className="text-slate-400 mb-8 text-sm">เข้าสู่ระบบเพื่อบันทึกพอร์ตโฟลิโอของคุณไว้บน Cloud อย่างปลอดภัย (ข้อมูลไม่หายแม้เปลี่ยนเครื่อง)</p>
                            <button onClick={loginWithGoogle} className="w-full bg-white text-slate-800 font-bold py-3 px-4 rounded-xl shadow hover:bg-slate-100 transition flex items-center justify-center gap-3">
                                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" className="w-5 h-5"/>
                                เข้าสู่ระบบด้วยบัญชี Google
                            </button>
                        </div>
                    </div>
                );
            }

            // 🌟 หน้า Dashboard หลัก (หลังจาก Login สำเร็จ)
            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 space-y-6 fade-in">
                    {/* Header + Profile */}
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <div className="flex items-center gap-4">
                            <img src={user.photoURL || 'https://via.placeholder.com/150'} alt="Profile" className="w-12 h-12 rounded-full border-2 border-blue-500" />
                            <div>
                                <h1 className="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                                    Robo-Rebalancer V3
                                </h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <p className="text-slate-400 text-xs">ยินดีต้อนรับ, {user.displayName}</p>
                                    <button onClick={logout} className="text-[10px] bg-slate-700 hover:bg-rose-500/80 text-white px-2 py-0.5 rounded transition">ออกจากระบบ</button>
                                </div>
                            </div>
                        </div>
                        <div className="text-right">
                            <div className="flex items-center justify-end gap-2 text-sm text-slate-400">
                                มูลค่าพอร์ตปัจจุบัน (THB) 
                                {isSyncing ? <span className="text-xs text-blue-400 animate-pulse">☁️ Syncing...</span> : <span className="text-xs text-emerald-400">☁️ Cloud Saved</span>}
                            </div>
                            <h2 className="text-4xl font-black text-white">{formatMoney(analysis.currentTotalValueTHB, 'THB')}</h2>
                            <div className={`text-sm font-bold mt-1 ${analysis.totalProfitLoss >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {analysis.totalProfitLoss >= 0 ? '▲' : '▼'} {formatMoney(Math.abs(analysis.totalProfitLoss), 'THB')} 
                                ({analysis.totalCostTHB > 0 ? ((analysis.totalProfitLoss/analysis.totalCostTHB)*100).toFixed(2) : 0}%)
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* ฝั่งซ้าย: Form (ย่อโค้ด UI ลงเพื่อความกระชับ) */}
                        <div className="lg:col-span-4 space-y-6">
                            <div className={`glass-panel p-6 rounded-2xl transition-all duration-300 ${editId ? 'ring-2 ring-blue-500 shadow-blue-900/50 bg-slate-800' : ''}`}>
                                <h3 className="text-lg font-bold text-white mb-4 border-b border-slate-600 pb-2">
                                    {editId ? '✏️ แก้ไขสินทรัพย์' : '➕ เพิ่มสินทรัพย์'}
                                </h3>
                                <form onSubmit={saveAsset} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-400 mb-1">สัญลักษณ์ (Symbol)</label>
                                            <input type="text" value={symbol} onChange={e => setSymbol(e.target.value)} className="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-white uppercase outline-none focus:border-blue-500" placeholder="AAPL" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 mb-1">จำนวนหุ้น</label>
                                            <input type="number" step="0.0001" value={shares} onChange={e => setShares(e.target.value)} className="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-white outline-none" required min="0" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 mb-1">เป้าหมาย (%)</label>
                                            <input type="number" step="0.1" value={targetWeight} onChange={e => setTargetWeight(e.target.value)} className="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-white outline-none" required min="0" max="100" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 mb-1">ทุนเฉลี่ย</label>
                                            <input type="number" step="0.01" value={avgPrice} onChange={e => setAvgPrice(e.target.value)} className="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-white outline-none" required min="0" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 mb-1">สกุลเงิน</label>
                                            <select value={currency} onChange={e => setCurrency(e.target.value)} className="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-white font-bold outline-none">
                                                <option value="USD">USD ($)</option>
                                                <option value="THB">THB (฿)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 mt-4">
                                        {editId && <button type="button" onClick={() => setEditId(null)} className="w-1/3 bg-slate-700 text-white font-bold py-3 rounded-lg">ยกเลิก</button>}
                                        <button type="submit" className={`flex-1 font-bold py-3 rounded-lg transition text-white ${editId ? 'bg-blue-600 hover:bg-blue-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}>
                                            {editId ? 'อัปเดตข้อมูล' : 'บันทึกสินทรัพย์'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        {/* ฝั่งขวา: Table Dashboard */}
                        <div className="lg:col-span-8 space-y-6">
                            
                            {/* Rebalance Mode Selector */}
                            <div className="glass-panel p-4 rounded-2xl flex flex-col md:flex-row gap-4 items-center justify-between border-t-4 border-t-blue-500">
                                <div className="flex-1 w-full flex gap-3">
                                    <label className={`flex-1 flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer transition-all ${rebalanceMode === 'CLASSIC' ? 'bg-blue-900/40 border-blue-400' : 'bg-slate-800/50 border-slate-600 hover:border-slate-400'}`}>
                                        <input type="radio" checked={rebalanceMode === 'CLASSIC'} onChange={() => setRebalanceMode('CLASSIC')} className="hidden" />
                                        <div className="font-bold text-sm text-blue-100">⚖️ ขาย-ซื้อ ปกติ</div>
                                    </label>
                                    <label className={`flex-1 flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer transition-all ${rebalanceMode === 'BUY_ONLY' ? 'bg-emerald-900/40 border-emerald-400' : 'bg-slate-800/50 border-slate-600 hover:border-slate-400'}`}>
                                        <input type="radio" checked={rebalanceMode === 'BUY_ONLY'} onChange={() => setRebalanceMode('BUY_ONLY')} className="hidden" />
                                        <div className="font-bold text-sm text-emerald-100">💰 เติมเงิน (ไม่ขาย)</div>
                                    </label>
                                </div>
                                {rebalanceMode === 'BUY_ONLY' && (
                                    <div className="flex-1 w-full flex items-center bg-slate-900 rounded-lg border border-emerald-500/50 overflow-hidden fade-in">
                                        <span className="px-3 text-emerald-500 font-bold">฿</span>
                                        <input type="number" value={cashToAdd || ''} onChange={e => setCashToAdd(Number(e.target.value))} className="w-full p-2.5 bg-transparent border-none outline-none text-white text-lg font-bold" placeholder="ยอดเงินเติม" />
                                    </div>
                                )}
                            </div>

                            {/* Table */}
                            <div className="glass-panel rounded-2xl overflow-hidden shadow-2xl border-slate-700">
                                <div className="flex justify-between items-center p-4 bg-slate-800/80 border-b border-slate-700">
                                    <h3 className="font-bold text-slate-200">📊 ตารางพอร์ตโฟลิโอ</h3>
                                    <button onClick={fetchMarketData} disabled={isLoading} className={`text-xs px-3 py-1.5 rounded font-bold transition-all ${isLoading ? 'bg-slate-700 text-slate-500' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}`}>
                                        {isLoading ? '⏳ กำลังอัปเดต...' : '🔄 ซิงค์ราคาล่าสุด'}
                                    </button>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left text-slate-300">
                                        <thead className="text-[11px] text-slate-400 uppercase bg-slate-900/50">
                                            <tr>
                                                <th className="px-4 py-3 font-bold">สินทรัพย์ (ทุน)</th>
                                                <th className="px-4 py-3 font-bold text-right">มูลค่าปัจจุบัน (P/L)</th>
                                                <th className="px-4 py-3 font-bold text-center">สัดส่วน ปัจจุบัน ➡ เป้าหมาย</th>
                                                <th className="px-4 py-3 font-bold text-right bg-blue-900/20">คำแนะนำ (Action)</th>
                                                <th className="px-2 py-3 text-center">จัดการ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/50">
                                            {analysis.rebalancePlan.length === 0 && (
                                                <tr><td colSpan="5" className="text-center py-10 text-slate-500">กรุณาเพิ่มสินทรัพย์ด้านซ้ายมือ</td></tr>
                                            )}
                                            {analysis.rebalancePlan.map(item => {
                                                const isBuy = item.diffValueTHB > 1; 
                                                const isSell = item.diffValueTHB < -1;
                                                const actionColor = isBuy ? 'text-emerald-400' : (isSell ? 'text-rose-400' : 'text-slate-500');
                                                const plColor = item.profitLoss >= 0 ? 'text-emerald-400' : 'text-rose-400';
                                                
                                                return (
                                                    <tr key={item.id} className="hover:bg-slate-800/50 transition-colors">
                                                        <td className="px-4 py-4">
                                                            <div className="font-black text-white text-lg tracking-wider">{item.symbol}</div>
                                                            <div className="text-[10px] text-slate-500 mt-1">หุ้น: {item.shares.toLocaleString()} | ทุน: {formatMoney(item.avgPrice, item.currency)}</div>
                                                        </td>
                                                        <td className="px-4 py-4 text-right">
                                                            <div className="font-bold text-slate-200">{formatMoney(item.currentValueTHB, 'THB')}</div>
                                                            <div className={`text-[10px] font-bold mt-1 ${plColor}`}>
                                                                {item.profitLoss >= 0 ? '▲' : '▼'} {formatMoney(Math.abs(item.profitLoss), 'THB')}
                                                            </div>
                                                            <div className="text-[10px] text-slate-500 mt-0.5">ราคา: {formatMoney(item.marketPrice, item.currency)}</div>
                                                        </td>
                                                        <td className="px-4 py-4 w-48">
                                                            <div className="flex items-center justify-between text-xs mb-1">
                                                                <span className="font-bold text-slate-300">{formatPercent(item.currentWeight)}</span>
                                                                <span className="text-slate-600 text-[10px]">➡</span>
                                                                <span className="font-bold text-blue-400 bg-blue-900/30 px-1.5 py-0.5 rounded">{formatPercent(item.targetWeight)}</span>
                                                            </div>
                                                            <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden flex relative">
                                                                <div className="absolute top-0 bottom-0 border-l border-red-500 z-10" style={{left: `${item.targetWeight}%`}}></div>
                                                                <div className="bg-blue-500 h-full" style={{ width: `${Math.min(item.currentWeight, 100)}%` }}></div>
                                                            </div>
                                                        </td>
                                                        <td className="px-4 py-4 text-right bg-blue-900/10">
                                                            {!analysis.isWeightValid ? (
                                                                <span className="text-slate-600 text-xs">เป้าไม่ครบ 100%</span>
                                                            ) : (
                                                                <div>
                                                                    <div className={`font-black ${actionColor}`}>{isBuy ? '+' : (isSell ? '' : '')}{formatMoney(item.diffValueTHB, 'THB')}</div>
                                                                    <div className={`text-[11px] ${actionColor} opacity-90 mt-0.5 font-bold`}>
                                                                        {isBuy ? '🛒 ซื้อ ' : (isSell ? '📉 ขาย ' : '✅ พอดี ')}
                                                                        {Math.abs(item.actionShares).toLocaleString("th-TH", { maximumFractionDigits: 4 })} หุ้น
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </td>
                                                        <td className="px-2 py-4 text-center">
                                                            <div className="flex justify-center gap-2">
                                                                <button onClick={() => editAsset(item)} className="text-slate-500 hover:text-blue-400">✏️</button>
                                                                <button onClick={() => removeAsset(item.id)} className="text-slate-500 hover:text-rose-400">🗑️</button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
