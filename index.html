<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio Tracker Pro | By Jake the Red Dog</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. โหลด React & ReactDOM (ล็อคเวอร์ชัน) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 3. โหลด Babel สำหรับแปลงโค้ด JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- 4. Dependencies สำหรับ Recharts (สร้างกราฟ) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>
    
    <!-- 5. Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        /* ซ่อนลูกศรในช่อง Input Number */
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Legend } = window.Recharts;

        // =========================================================================
        // 🔥 FIREBASE CONFIGURATION
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAi0LJXM9eiyDeBALit1zmMbvaK9uO_WR8",
            authDomain: "portfolio-price-update.firebaseapp.com",
            projectId: "portfolio-price-update",
            storageBucket: "portfolio-price-update.firebasestorage.app",
            messagingSenderId: "10843745696",
            appId: "1:10843745696:web:4ce9cadc0e8c67fbc448c5",
            measurementId: "G-ZHMNN3H82R"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // =========================================================================
        // 🛠️ UTILITY FUNCTIONS
        // =========================================================================
        const formatMoney = (amount, currency = 'THB') => {
            const symbol = currency === 'USD' ? '$' : '฿';
            return symbol + (amount || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };
        const formatCompact = (val) => {
            if (val >= 1000000) return (val / 1000000).toFixed(2) + "M";
            if (val >= 1000) return (val / 1000).toFixed(1) + "K";
            return Math.round(val);
        };
        const formatPercent = (percent) => (percent > 0 ? "+" : "") + (percent || 0).toLocaleString("en-US", { maximumFractionDigits: 2 }) + "%";

        function App() {
            // --- 1. System States ---
            const [user, setUser] = useState(null);
            const [isAuthChecking, setIsAuthChecking] = useState(true);
            const [isLoading, setIsLoading] = useState(false);
            const [fxRate, setFxRate] = useState(35.00); 

            // --- 2. Portfolio Data States ---
            const [portfolios, setPortfolios] = useState({}); 
            const [activePortId, setActivePortId] = useState(null);
            const [prices, setPrices] = useState({});
            
            // --- 3. UI Controls ---
            const [rebalanceMode, setRebalanceMode] = useState('CLASSIC');
            const [cashToAdd, setCashToAdd] = useState("");
            const [cashCurrency, setCashCurrency] = useState('THB');
            
            const [dcaAmount, setDcaAmount] = useState("");
            const [dcaCurrency, setDcaCurrency] = useState('THB');

            const [graphTimeframe, setGraphTimeframe] = useState('ALL'); 
            
            // 🌟 GLOBAL CURRENCY TOGGLE (ตัวแปรควบคุมสกุลเงินที่โชว์ทั้งเว็บ)
            const [displayCurrency, setDisplayCurrency] = useState('THB'); 

            // 🌟 Helper Formatters สำหรับใช้ทั่วเว็บ
            const valDisp = useCallback((thbVal) => displayCurrency === 'USD' ? thbVal / fxRate : thbVal, [displayCurrency, fxRate]);
            const fmtDisp = useCallback((thbVal) => formatMoney(valDisp(thbVal), displayCurrency), [valDisp, displayCurrency]);

            // --- 4. Form States ---
            const [editId, setEditId] = useState(null);
            const [symbol, setSymbol] = useState("");
            const [avgPrice, setAvgPrice] = useState("");
            const [shares, setShares] = useState("");
            const [totalCost, setTotalCost] = useState("");
            const [currency, setCurrency] = useState("USD");
            const [targetWeight, setTargetWeight] = useState("");

            const activePortfolio = portfolios[activePortId] || { name: 'กำลังโหลด...', assets: [], history: [], goal: null };
            const assets = activePortfolio.assets || [];

            // ---------------------------------------------------------
            // ☁️ FIREBASE SYNC LOGIC
            // ---------------------------------------------------------
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    setIsAuthChecking(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (user) {
                    const docRef = db.collection('users').doc(user.uid);
                    const unsubscribe = docRef.onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.portfolios) {
                                setPortfolios(data.portfolios);
                                if (!activePortId) setActivePortId(Object.keys(data.portfolios)[0]);
                            }
                        } else {
                            const newStruct = { 'default_port': { name: 'พอร์ตหลัก', assets: [], history: [], goal: null } };
                            docRef.set({ portfolios: newStruct, createdAt: new Date() });
                            setPortfolios(newStruct);
                            setActivePortId('default_port');
                        }
                    });
                    return () => unsubscribe();
                }
            }, [user]);

            const saveToCloud = async (newPortfoliosData) => {
                if (user) await db.collection('users').doc(user.uid).update({ portfolios: newPortfoliosData });
            };

            // ---------------------------------------------------------
            // 📈 SMART FORM LOGIC
            // ---------------------------------------------------------
            const handleSharesChange = (val) => {
                setShares(val);
                if (val && avgPrice) setTotalCost((parseFloat(val) * parseFloat(avgPrice)).toFixed(2));
                else if (val === "") setTotalCost("");
            };
            const handleAvgPriceChange = (val) => {
                setAvgPrice(val);
                if (val && shares) setTotalCost((parseFloat(shares) * parseFloat(val)).toFixed(2));
                else if (val && totalCost) setShares((parseFloat(totalCost) / parseFloat(val)).toFixed(4));
            };
            const handleTotalCostChange = (val) => {
                setTotalCost(val);
                if (val && avgPrice) setShares((parseFloat(val) / parseFloat(avgPrice)).toFixed(4));
                else if (val && shares) setAvgPrice((parseFloat(val) / parseFloat(shares)).toFixed(2));
            };

            // ---------------------------------------------------------
            // 🌐 MARKET DATA (🌟 MULTI-PROXY FALLBACK)
            // ---------------------------------------------------------
            const fetchMarketData = useCallback(async () => {
                if (!activePortId || assets.length === 0) return;
                setIsLoading(true);
                let newPrices = { ...prices };
                let currentFx = fxRate;
                let localFetchedPrices = {};

                // 1. อ่าน Cache
                try {
                    const localRes = await fetch('./prices.json');
                    if (localRes.ok) {
                        const localData = await localRes.json();
                        localFetchedPrices = localData.prices || {};
                        currentFx = localData.fxRate || 35.00;
                    }
                } catch (e) { console.log("Cache missed."); }

                // 🌟 2. ฟังก์ชันดึงราคาสด แบบมี Proxy สำรอง 2 ชั้น
                const fetchLivePrice = async (targetUrl) => {
                    const proxies = ['https://corsproxy.io/?', 'https://api.allorigins.win/raw?url='];
                    for (let proxy of proxies) {
                        try {
                            const res = await fetch(proxy + encodeURIComponent(targetUrl));
                            if (res.ok) {
                                const data = await res.json();
                                return data.chart.result[0].meta.regularMarketPrice;
                            }
                        } catch (err) { console.warn(`Proxy ${proxy} failed.`); }
                    }
                    throw new Error("All proxies failed.");
                };

                // 3. จัดการ FX Rate หากไม่มีใน Cache
                if (!localFetchedPrices['AAPL']) { 
                    try {
                        currentFx = await fetchLivePrice('https://query1.finance.yahoo.com/v8/finance/chart/THB=X');
                    } catch (error) {}
                }

                // 4. วนลูปดึงราคาหุ้น
                for (let item of assets) {
                    const ticker = item.symbol.toUpperCase();
                    if (item.currency === 'THB' && !ticker.includes('.')) { 
                        newPrices[ticker] = 1; continue; 
                    }
                    if (localFetchedPrices[ticker]) {
                        newPrices[ticker] = localFetchedPrices[ticker];
                    } else {
                        try {
                            newPrices[ticker] = await fetchLivePrice(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`);
                        } catch (err) {
                            console.error(`Failed to live-fetch ${ticker}`);
                        }
                    }
                }
                
                setPrices(newPrices);
                setFxRate(currentFx);
                setIsLoading(false);
            }, [assets, activePortId, fxRate]);

            useEffect(() => { if(user && activePortId) fetchMarketData(); }, [user, activePortId]);

            // Snapshot System
            useEffect(() => {
                if (!isLoading && Object.keys(prices).length > 0 && activePortId && assets.length > 0) {
                    const todayStr = new Date().toISOString().split('T')[0];
                    let calcCostTHB = 0; let calcValueTHB = 0;
                    
                    assets.forEach(item => {
                        const marketPrice = prices[item.symbol] || item.avgPrice || 1;
                        const fxMult = item.currency === 'USD' ? fxRate : 1;
                        calcCostTHB += item.avgPrice * item.shares * fxMult;
                        calcValueTHB += marketPrice * item.shares * fxMult;
                    });

                    let history = activePortfolio.history || [];
                    const lastEntry = history.length > 0 ? history[history.length - 1] : null;
                    if (!lastEntry || lastEntry.date !== todayStr) {
                        const newHistory = [...history, { date: todayStr, cost: calcCostTHB, value: calcValueTHB }];
                        saveToCloud({ ...portfolios, [activePortId]: { ...activePortfolio, history: newHistory } });
                    }
                }
            }, [prices, isLoading]);

            // ---------------------------------------------------------
            // 🧠 REBALANCING ENGINE
            // ---------------------------------------------------------
            const analysis = useMemo(() => {
                let currentTotalValueTHB = 0; let totalTargetWeight = 0; let totalCostTHB = 0;

                const enrichedPortfolio = assets.map(item => {
                    const marketPrice = prices[item.symbol] || item.avgPrice || 1; 
                    const fxMult = item.currency === 'USD' ? fxRate : 1;
                    const costTHB = item.avgPrice * item.shares * fxMult;
                    const currentValueTHB = marketPrice * item.shares * fxMult;
                    
                    currentTotalValueTHB += currentValueTHB;
                    totalTargetWeight += parseFloat(item.targetWeight || 0);
                    totalCostTHB += costTHB;

                    const profitLoss = currentValueTHB - costTHB;
                    const profitLossPercent = costTHB > 0 ? (profitLoss / costTHB) * 100 : 0;
                    return { ...item, marketPrice, currentValueTHB, costTHB, profitLoss, profitLossPercent };
                });

                const isWeightValid = Math.abs(totalTargetWeight - 100) < 0.1; 
                const safeCashToAdd = parseFloat(cashToAdd) || 0;
                const cashToAddTHB = safeCashToAdd * (cashCurrency === 'USD' ? fxRate : 1);
                const targetTotalValueTHB = currentTotalValueTHB + (rebalanceMode === 'CLASSIC' ? 0 : cashToAddTHB);

                let shortfallSum = 0;
                const shortfalls = enrichedPortfolio.map(item => {
                    const targetValueTHB = targetTotalValueTHB * (item.targetWeight / 100);
                    const currentWeight = currentTotalValueTHB > 0 ? (item.currentValueTHB / currentTotalValueTHB) * 100 : 0;
                    let diffValueTHB = targetValueTHB - item.currentValueTHB;
                    let shortfall = 0;

                    if (rebalanceMode === 'BUY_ONLY') {
                        shortfall = Math.max(0, diffValueTHB);
                        shortfallSum += shortfall;
                    }
                    return { ...item, currentWeight, targetValueTHB, rawDiffValueTHB: diffValueTHB, shortfall };
                });

                const rebalancePlan = shortfalls.map(item => {
                    let finalActionTHB = item.rawDiffValueTHB;
                    if (rebalanceMode === 'BUY_ONLY') {
                        finalActionTHB = (shortfallSum > 0 && cashToAddTHB > 0) ? cashToAddTHB * (item.shortfall / shortfallSum) : 0;
                    }
                    const fxMult = item.currency === 'USD' ? fxRate : 1;
                    const actionShares = item.marketPrice > 0 ? (finalActionTHB / fxMult) / item.marketPrice : 0;
                    return { ...item, diffValueTHB: finalActionTHB, actionShares };
                });

                return { currentTotalValueTHB, totalCostTHB, totalProfitLoss: currentTotalValueTHB - totalCostTHB, totalTargetWeight, isWeightValid, rebalancePlan };
            }, [assets, prices, fxRate, rebalanceMode, cashToAdd, cashCurrency]);

            // ---------------------------------------------------------
            // 🛠️ ACTIONS & FORMS
            // ---------------------------------------------------------
            const handleAuth = async () => {
                if (user) await auth.signOut();
                else {
                    try { await auth.signInWithPopup(googleProvider); } catch (e) { alert("Login Failed"); }
                }
            };

            const saveAsset = (e) => {
                e.preventDefault();
                if (!symbol) return;
                const s = parseFloat(shares) || 0; const c = parseFloat(totalCost) || 0;
                const ap = parseFloat(avgPrice) || (s > 0 ? c/s : 0);
                const finalShares = s > 0 ? s : (ap > 0 ? c/ap : 0);

                const assetData = { symbol: symbol.toUpperCase(), shares: finalShares, avgPrice: ap, currency, targetWeight: parseFloat(targetWeight) || 0 };
                let newAssets = editId ? assets.map(p => p.id === editId ? { ...p, ...assetData } : p) : [...assets, { id: Date.now(), ...assetData }];
                
                const updatedPorts = { ...portfolios, [activePortId]: { ...activePortfolio, assets: newAssets } };
                setPortfolios(updatedPorts); saveToCloud(updatedPorts);
                setSymbol(""); setShares(""); setAvgPrice(""); setTotalCost(""); setTargetWeight(""); setEditId(null);
                setTimeout(fetchMarketData, 200); 
            };

            const editAsset = (item) => {
                setEditId(item.id); setSymbol(item.symbol); setShares(item.shares);
                setAvgPrice(item.avgPrice); setTotalCost((item.shares * item.avgPrice).toFixed(2));
                setCurrency(item.currency); setTargetWeight(item.targetWeight);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const removeAsset = (id) => {
                if(window.confirm("ยืนยันการลบ?")) {
                    const newAssets = assets.filter(a => a.id !== id);
                    const updatedPorts = { ...portfolios, [activePortId]: { ...activePortfolio, assets: newAssets } };
                    setPortfolios(updatedPorts); saveToCloud(updatedPorts);
                    if(editId === id) cancelEdit();
                }
            };
            const cancelEdit = () => { setEditId(null); setSymbol(""); setShares(""); setAvgPrice(""); setTotalCost(""); setTargetWeight(""); }

            // --- Goal Tracking ---
            const [showGoalForm, setShowGoalForm] = useState(false);
            const [goalInvest, setGoalInvest] = useState("120000");
            const [goalGrowth, setGoalGrowth] = useState("8");

            const saveGoal = () => {
                const goalData = { annualInvest: parseFloat(goalInvest), targetGrowth: parseFloat(goalGrowth), startYear: new Date().getFullYear(), startValue: analysis.currentTotalValueTHB };
                const updatedPorts = { ...portfolios, [activePortId]: { ...activePortfolio, goal: goalData } };
                setPortfolios(updatedPorts); saveToCloud(updatedPorts); setShowGoalForm(false);
            };

            const getGoalStatus = () => {
                if (!activePortfolio.goal) return null;
                const { annualInvest, targetGrowth, startYear, startValue } = activePortfolio.goal;
                const yearsElapsed = new Date().getFullYear() - startYear;
                const r = targetGrowth / 100;
                let expectedValue = startValue;
                if (yearsElapsed > 0) expectedValue = startValue * Math.pow(1 + r, yearsElapsed) + annualInvest * ((Math.pow(1 + r, yearsElapsed) - 1) / r);
                else expectedValue = startValue + (annualInvest * ((new Date().getMonth() + 1) / 12));
                return { expectedValue, diff: analysis.currentTotalValueTHB - expectedValue };
            };
            const goalStatus = getGoalStatus();

            // --- Chart Logic ---
            const chartData = useMemo(() => {
                let data = activePortfolio.history || [];
                if (data.length === 0) return [];
                const now = new Date(); let cutoffDate = new Date(0);
                if (graphTimeframe === '1M') cutoffDate.setMonth(now.getMonth() - 1);
                else if (graphTimeframe === '3M') cutoffDate.setMonth(now.getMonth() - 3);
                else if (graphTimeframe === '6M') cutoffDate.setMonth(now.getMonth() - 6);
                else if (graphTimeframe === '1Y') cutoffDate.setFullYear(now.getFullYear() - 1);
                else if (graphTimeframe === 'YTD') cutoffDate = new Date(now.getFullYear(), 0, 1);

                return data.filter(d => new Date(d.date) >= cutoffDate).map(d => ({
                    ...d, dateLabel: new Date(d.date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }),
                    "มูลค่าตลาด": valDisp(d.value), "ต้นทุนรวม": valDisp(d.cost)
                }));
            }, [activePortfolio.history, graphTimeframe, valDisp]);

            // ---------------------------------------------------------
            // 🖥️ UI RENDER
            // ---------------------------------------------------------
            if (isAuthChecking) return <div className="min-h-screen flex items-center justify-center text-slate-400 font-bold">กำลังโหลดระบบ...</div>;

            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                        <div className="glass-panel p-8 rounded-3xl max-w-sm w-full text-center fade-in">
                            <h1 className="text-5xl mb-4">📈</h1>
                            <h2 className="text-3xl font-black text-white mb-2">Portfolio Pro</h2>
                            <p className="text-slate-400 text-sm mb-8">เข้าสู่ระบบเพื่อซิงค์ข้อมูลบน Cloud</p>
                            <button onClick={handleAuth} className="w-full bg-white text-slate-800 font-black py-4 rounded-xl shadow-[0_10px_20px_rgba(255,255,255,0.1)] hover:scale-105 transition-transform flex justify-center items-center gap-3">
                                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                Sign in with Google
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto p-3 md:p-6 space-y-6 fade-in pb-20">
                    <div className="relative glass-panel p-5 md:p-6 rounded-3xl border border-slate-700 shadow-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 overflow-hidden">
                        <div className="absolute top-0 right-0 p-4">
                            <button onClick={handleAuth} className="text-[10px] md:text-xs font-bold bg-rose-500/20 text-rose-400 px-3 py-1.5 rounded-full hover:bg-rose-500 hover:text-white transition">ออกจากระบบ</button>
                        </div>
                        
                        <div className="z-10 w-full md:w-auto">
                            <div className="flex items-center gap-3 mb-3">
                                <select value={activePortId || ''} onChange={(e) => setActivePortId(e.target.value)} className="bg-slate-900 border border-slate-600 text-white font-black text-xl md:text-2xl p-2 rounded-xl focus:outline-none focus:border-blue-500 cursor-pointer">
                                    {Object.entries(portfolios).map(([id, p]) => <option key={id} value={id}>📂 {p.name}</option>)}
                                </select>
                                <button onClick={createNewPortfolio} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-sm font-bold shadow-sm transition">+</button>
                            </div>
                            
                            {/* 🌟 GLOBAL CURRENCY TOGGLE */}
                            <div className="flex items-center gap-3">
                                <div className="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 w-max">
                                    <button onClick={() => setDisplayCurrency('THB')} className={`px-3 py-1.5 text-[11px] font-bold rounded-md transition ${displayCurrency === 'THB' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>THB ฿</button>
                                    <button onClick={() => setDisplayCurrency('USD')} className={`px-3 py-1.5 text-[11px] font-bold rounded-md transition ${displayCurrency === 'USD' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>USD $</button>
                                </div>
                                <p className="text-slate-500 text-[10px] md:text-xs">1 USD = {fxRate.toFixed(2)} THB</p>
                            </div>
                        </div>

                        <div className="z-10 text-left md:text-right w-full md:w-auto bg-slate-900/50 p-4 rounded-2xl md:bg-transparent md:p-0 mt-2 md:mt-0">
                            <p className="text-xs text-slate-400 font-bold mb-1">มูลค่าพอร์ตปัจจุบัน ({displayCurrency})</p>
                            <h2 className="text-3xl md:text-5xl font-black text-white tracking-tight">{fmtDisp(analysis.currentTotalValueTHB)}</h2>
                            <div className={`text-sm md:text-base font-bold mt-1 flex items-center gap-2 md:justify-end ${analysis.totalProfitLoss >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {analysis.totalProfitLoss >= 0 ? '▲' : '▼'} {fmtDisp(Math.abs(analysis.totalProfitLoss))} 
                                <span className={`px-2 py-0.5 rounded-md text-xs bg-slate-800 ${analysis.totalProfitLoss >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                    {analysis.totalCostTHB > 0 ? formatPercent((analysis.totalProfitLoss/analysis.totalCostTHB)*100) : '0.00%'}
                                </span>
                            </div>
                        </div>
                    </div>

                                    <div className="flex bg-slate-900 p-1 rounded-xl">
                                        {['1M', '3M', '6M', '1Y', 'YTD', 'ALL'].map(tf => (
                                            <button key={tf} onClick={() => setGraphTimeframe(tf)} className={`px-3 py-1.5 text-[10px] md:text-xs font-bold rounded-lg transition-colors ${graphTimeframe === tf ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                                {tf}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="h-[250px] md:h-[350px] w-full">
                                    {chartData.length < 2 ? (
                                        <div className="h-full w-full flex items-center justify-center text-slate-500 text-xs text-center border-2 border-dashed border-slate-700 rounded-2xl">
                                            ต้องการข้อมูลประวัติอย่างน้อย 2 วันในการแสดงกราฟ<br/>ระบบจะบันทึกให้อัตโนมัติเมื่อคุณเปิดแอปเข้ามาในวันถัดไป
                                        </div>
                                    ) : (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={chartData} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                                <XAxis dataKey="dateLabel" tick={{ fontSize: 10, fill: '#94a3b8' }} axisLine={false} tickLine={false} />
                                                <YAxis tickFormatter={formatCompact} tick={{ fontSize: 10, fill: '#94a3b8' }} axisLine={false} tickLine={false} />
                                                <Tooltip 
                                                    formatter={(value, name) => [formatMoney(value, displayCurrency), name]}
                                                    contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.95)', border: 'none', borderRadius: '12px', boxShadow: '0 10px 25px -5px rgba(0,0,0,0.5)', fontSize: '12px' }}
                                                    itemStyle={{ fontWeight: 'bold' }}
                                                    labelStyle={{ color: '#94a3b8', marginBottom: '8px', fontSize: '11px', borderBottom: '1px solid #334155', paddingBottom: '4px' }}
                                                />
                                                <Legend wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} iconType="circle" />
                                                <Line type="monotone" dataKey="มูลค่าตลาด" stroke="#34d399" strokeWidth={3} dot={false} activeDot={{ r: 6, fill: '#34d399', stroke: '#0f172a', strokeWidth: 2 }} />
                                                <Line type="monotone" dataKey="ต้นทุนรวม" stroke="#94a3b8" strokeWidth={2} strokeDasharray="5 5" dot={false} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
