name: 🔄 Daily Price Auto-Update (7:00 AM BKK)
on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write
jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: 🛠️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 📈 Fetch Latest Prices from Yahoo Finance
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const symbols = ['AAPL', 'TSLA', 'MSFT', 'VOO', 'QQQ'];
            let resultData = { prices: {}, fxRate: 35.0, lastUpdated: new Date().toISOString() };
            try {
            console.log("Fetching THB=X...");
            const fxRes = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/THB=X');
            if (fxRes.ok) {
            const fxData = await fxRes.json();
            resultData.fxRate = fxData.chart.result[0].meta.regularMarketPrice;
            }

            for (const sym of symbols) {
            console.log(⁠Fetching ${sym}...⁠);
            const res = await fetch(⁠https://query1.finance.yahoo.com/v8/finance/chart/${sym}⁠);
            if (res.ok) {
            const data = await res.json();
            resultData.prices[sym] = data.chart.result[0].meta.regularMarketPrice;
            }
            }
            fs.writeFileSync('./prices.json', JSON.stringify(resultData, null, 2));
            console.log("✅ Successfully saved prices.json!");
            } catch (error) {
            console.error("❌ Error fetching prices:", error);
            process.exit(1); // บังคับให้ Action fail ถ้ามีปัญหา
            }
      - name: 💾 Commit and Push changes
        run: |
          git config --global user.name "Robo-Rebalancer Bot"
          git config --global user.email "bot@robo-rebalancer.local"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update latest stock prices [skip ci]" && git push)
